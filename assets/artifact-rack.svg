<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Artifact rack panel — two deployed modules: edumaster-quiz-app (interactive quiz engine, accounts, timed sessions, dashboard — cos 107 group b group 1) and temperature-converter (unit converter, one input, four conversion paths). Both mounted, tech: HTML, CSS, JavaScript.">
  <title>deployed artifacts — storage bays</title>
  <defs>
    <pattern id="scan2" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect x="0" y="0" width="4" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
    <filter id="noise2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <style>
    .m { font-family:'Cascadia Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace; }
  </style>

  <rect x="0" y="0" width="880" height="260" fill="#0A0A0A"/>

  <!-- frame crosshairs -->
  <g stroke="#3F3F3F" stroke-width="1">
    <path d="M 20 32 H 36 M 28 24 V 40"/>
    <path d="M 844 32 H 860 M 852 24 V 40"/>
    <path d="M 20 248 H 36 M 28 240 V 256"/>
    <path d="M 844 248 H 860 M 852 240 V 256"/>
  </g>

  <!-- top strip -->
  <text x="40" y="27" class="m" font-size="10" letter-spacing="2" fill="#EAEAEA">[ ARTIFACT_RACK ]</text>
  <text x="836" y="27" text-anchor="end" class="m" font-size="9" letter-spacing="1.5" fill="#5E5E5E">MOUNTS 2/2 · LIVE</text>
  <line x1="28" y1="40" x2="852" y2="40" stroke="#242424" stroke-width="1"/>

  <!-- enclosure -->
  <rect x="28" y="56" width="824" height="176" fill="#0F0F0F" stroke="#2E2E2E" stroke-width="1"/>
  <line x1="440" y1="56" x2="440" y2="232" stroke="#2E2E2E" stroke-width="1"/>

  <!-- bay 01 -->
  <rect x="404" y="76" width="8" height="8" fill="#4AF626"/>
  <text x="48" y="85" class="m" font-size="10" letter-spacing="2" fill="#6E6E6E">BAY 01</text>
  <text x="48" y="116" class="m" font-size="16" font-weight="600" fill="#EAEAEA">EDUMASTER-QUIZ-APP</text>
  <text x="48" y="140" class="m" font-size="10" letter-spacing="1" fill="#6E6E6E">module :: interactive quiz engine</text>
  <text x="48" y="160" class="m" font-size="10" fill="#9A9A9A"><tspan fill="#3F3F3F">&gt; </tspan><tspan>accounts · timed sessions · dashboard</tspan></text>
  <g>
    <rect x="48" y="172" width="36" height="16" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1"/>
    <text x="66" y="184" text-anchor="middle" class="m" font-size="9" letter-spacing="1" fill="#9A9A9A">HTML</text>
    <rect x="90" y="172" width="33" height="16" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1"/>
    <text x="106" y="184" text-anchor="middle" class="m" font-size="9" letter-spacing="1" fill="#9A9A9A">CSS</text>
    <rect x="129" y="172" width="72" height="16" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1"/>
    <text x="165" y="184" text-anchor="middle" class="m" font-size="9" letter-spacing="1" fill="#9A9A9A">JAVASCRIPT</text>
  </g>
  <text x="48" y="216" class="m" font-size="9" letter-spacing="1" fill="#5E5E5E">origin :: cos 107 · se group b (group 1)</text>

  <!-- bay 02 -->
  <rect x="816" y="76" width="8" height="8" fill="#4AF626"/>
  <text x="460" y="85" class="m" font-size="10" letter-spacing="2" fill="#6E6E6E">BAY 02</text>
  <text x="460" y="116" class="m" font-size="16" font-weight="600" fill="#EAEAEA">TEMPERATURE-CONVERTER</text>
  <text x="460" y="140" class="m" font-size="10" letter-spacing="1" fill="#6E6E6E">module :: unit converter</text>
  <text x="460" y="160" class="m" font-size="10" fill="#9A9A9A"><tspan fill="#3F3F3F">&gt; </tspan><tspan>celsius · fahrenheit · kelvin</tspan></text>
  <g>
    <rect x="460" y="172" width="36" height="16" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1"/>
    <text x="478" y="184" text-anchor="middle" class="m" font-size="9" letter-spacing="1" fill="#9A9A9A">HTML</text>
    <rect x="502" y="172" width="33" height="16" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1"/>
    <text x="518" y="184" text-anchor="middle" class="m" font-size="9" letter-spacing="1" fill="#9A9A9A">CSS</text>
    <rect x="541" y="172" width="72" height="16" fill="#0F0F0F" stroke="#3A3A3A" stroke-width="1"/>
    <text x="577" y="184" text-anchor="middle" class="m" font-size="9" letter-spacing="1" fill="#9A9A9A">JAVASCRIPT</text>
  </g>
  <text x="460" y="216" class="m" font-size="9" letter-spacing="1" fill="#5E5E5E">interface :: 1 input · 4 conversion paths</text>

  <!-- overlays -->
  <rect x="28" y="56" width="824" height="176" fill="url(#scan2)" opacity="0.12"/>
  <rect x="0" y="0" width="880" height="260" filter="url(#noise2)"/>
</svg>
